services:
  mantis-db:
    image: mariadb:11.4
    container_name: libreria-olimpia-mantis-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: mantis_root
      MARIADB_DATABASE: mantisbt
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: mantisbt123
    volumes:
      - mantisbt-db:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-pmantis_root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mantisbt:
    image: xlrl/mantisbt:2.28.3
    container_name: libreria-olimpia-mantis
    depends_on:
      mantis-db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      MANTIS_TIMEZONE: America/La_Paz
      MANTIS_ENABLE_ADMIN: "1"
    volumes:
      - ./docker/mantisbt/config:/var/www/html/config
      - ./docker/mantisbt/custom:/var/www/html/custom
      - mantisbt-files:/var/www/html/files

volumes:
  mantisbt-db:
  mantisbt-files:
